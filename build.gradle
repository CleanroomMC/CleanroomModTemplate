plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.versioning' version '2.0.0'
    id 'com.cleanroommc.tokenenvoy' version '1.1.0'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation cleanroom.userdev(providers.gradleProperty('cleanroom_version').get())
}

tokenEnvoy {
    set 'VERSION', project.version
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}
